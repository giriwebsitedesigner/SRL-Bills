<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challan Printing</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f5f9; color: #10233e; padding: 24px; }
    main { width: min(720px, 100%); }
    h1 { text-align: center; margin: 0 0 8px; font-size: clamp(28px, 5vw, 40px); }
    .intro { text-align: center; color: #5d6b7d; margin: 0 0 28px; }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .choice { display: block; min-height: 205px; border-radius: 18px; text-decoration: none; color: #10233e; background: #fff; padding: 26px; box-shadow: 0 12px 30px rgba(29, 53, 87, .12); border: 1px solid #e3e9f1; transition: transform .16s ease, box-shadow .16s ease; }
    .choice:hover, .choice:focus-visible { transform: translateY(-4px); box-shadow: 0 18px 34px rgba(29, 53, 87, .18); outline: 3px solid #82b6f4; outline-offset: 3px; }
    .choice strong { display: block; font-size: 24px; margin-bottom: 12px; }
    .choice span { color: #5d6b7d; line-height: 1.55; }
    .arrow { display: block; margin-top: 24px; color: #1769c2; font-size: 18px; font-weight: 700; }
    @media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Challan Printing</h1>
    <p class="intro">Select the challan you want to prepare and print.</p>
    <section class="choices" aria-label="Challan choices">
      <a class="choice" href="srl.html">
        <strong>SRL Challan</strong>
        <span>Prepare the SRL Blue Metals delivery challan with your trip details, then print it.</span>
        <span class="arrow">Open SRL Challan →</span>
      </a>
      <a class="choice" href="plain.html">
        <strong>Plain Challan</strong>
        <span>Open the fixed outgoing-trip plain challan in the supplied receipt format.</span>
        <span class="arrow">Open Plain Challan →</span>
      </a>
    </section>
  </main>
  <script>
    (function () {
      if (window.location.hash === "#plainChallan") {
        window.location.replace("plain.html");
      } else if (window.location.hash === "#challanApp") {
        window.location.replace("srl.html");
      }
    }());
  </script>
</body>
</html>
